name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/readme-covers/**"
      - "fonts/IBMPlexSansArabic-Regular.ttf"
      - "fonts/IBMPlexSansArabic-SemiBold.ttf"
      - "fonts/NotoKufiArabic-Bold.ttf"
      - "fonts/JetBrainsMono-Regular.ttf"
      - "VERSION"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Select published book assets
        id: book-source
        shell: bash
        run: |
          set -euo pipefail
          requested_version=$(tr -d '[:space:]' < VERSION)
          requested_base="https://github.com/Ghazi-Ai/command-line-series/releases/download/v$requested_version"
          probe_asset="1-linux-ar.pdf"
          if curl --fail --silent --show-error --location --head \
            "$requested_base/$probe_asset" >/dev/null
          then
            echo "version=$requested_version" >> "$GITHUB_OUTPUT"
            echo "base=$requested_base" >> "$GITHUB_OUTPUT"
            echo "Using book assets from Release v$requested_version."
          else
            fallback_version="1.2"
            fallback_base="https://github.com/Ghazi-Ai/command-line-series/releases/download/v$fallback_version"
            if ! curl --fail --silent --show-error --location --head \
              "$fallback_base/$probe_asset" >/dev/null
            then
              echo "::error::Neither Release v$requested_version nor fallback Release v$fallback_version has the required PDF assets."
              exit 1
            fi
            echo "::warning::Release v$requested_version does not exist or lacks PDF assets; Pages will use published Release v$fallback_version books while deploying the current site."
            echo "version=$fallback_version" >> "$GITHUB_OUTPUT"
            echo "base=$fallback_base" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore rendered reader pages
        id: reader-cache
        uses: actions/cache@v6
        with:
          path: _reader-cache
          key: reader-pages-v${{ steps.book-source.outputs.version }}-r131-q88

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/covers _site/assets/fonts _site/vendor
          cp site/index.html site/styles.css site/script.js site/reader.js _site/
          cp docs/readme-covers/*.png _site/assets/covers/
          cp fonts/IBMPlexSansArabic-Regular.ttf _site/assets/fonts/
          cp fonts/IBMPlexSansArabic-SemiBold.ttf _site/assets/fonts/
          cp fonts/NotoKufiArabic-Bold.ttf _site/assets/fonts/
          cp fonts/JetBrainsMono-Regular.ttf _site/assets/fonts/
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/build/pdf.mjs" \
            --output "_site/vendor/pdf.mjs"
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/build/pdf.worker.mjs" \
            --output "_site/vendor/pdf.worker.mjs"
          curl --fail --location --retry 3 \
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/LICENSE" \
            --output "_site/vendor/PDFJS-LICENSE"
          (
            cd _site/vendor
            echo "d7f44e075a8fa47ac165362d404de2dabf61f64f3d98c9180162c5f71f54980a  pdf.mjs" | sha256sum --check
            echo "f9ed6a050771ad74c228a1cbfc8edb3271249f2e2efa29ed4692468ecb001733  pdf.worker.mjs" | sha256sum --check
            echo "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594  PDFJS-LICENSE" | sha256sum --check
          )
          mkdir -p _site/books
          release_base="${{ steps.book-source.outputs.base }}"
          for asset in \
            1-linux-ar.pdf \
            2-macos-ar.pdf \
            3-windows-ar.pdf \
            4-bsd-ar.pdf \
            5-workbook-ar.pdf \
            6-unix-story-ar.pdf
          do
            curl --fail --location --retry 30 --retry-all-errors --retry-delay 10 \
              "$release_base/$asset" \
              --output "_site/books/$asset"
          done
          if [ "${{ steps.reader-cache.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get update
            sudo apt-get install --yes poppler-utils
            mkdir -p _reader-cache
            for pdf in _site/books/*.pdf
            do
              book=$(basename "$pdf" -ar.pdf)
              mkdir -p "_reader-cache/$book"
              pdftoppm -jpeg -r 130 -jpegopt quality=88,optimize=y,progressive=y \
                "$pdf" "_reader-cache/$book/page"
            done
          fi
          mkdir -p _site/reader-pages
          cp -a _reader-cache/. _site/reader-pages/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
